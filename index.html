<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020712">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>AXIS Jobs</title>
<style>
:root{--bg:#02050b;--card:#0a1220;--line:#18365c;--blue:#13a8ff;--blue2:#0069ff;--text:#f5f8ff;--muted:#91a0b6;--ok:#36d399;--warn:#ffbf47}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#02050b,#06101f);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:#020712ee;backdrop-filter:blur(12px);border-bottom:1px solid #13243b;padding:14px 16px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:13px;border:1px solid #159cff;box-shadow:0 0 18px #0878ff66;display:grid;place-items:center;font-weight:900;color:#fff;background:#071427}
header h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted)}
main{max-width:760px;margin:auto;padding:18px 14px 90px}
.hero{padding:18px;border:1px solid #14355b;border-radius:22px;background:radial-gradient(circle at 90% 0,#0a4f8f66,transparent 42%),#07101d;margin-bottom:16px}
.hero h2{font-size:28px;margin:0 0 4px}.hero b{color:var(--blue)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border:1px solid #142c4a;border-radius:18px;padding:16px}
.stat{font-size:27px;font-weight:800}.muted{color:var(--muted);font-size:13px}
button,.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:15px;background:linear-gradient(135deg,var(--blue2),var(--blue));color:white}
.secondary{background:#0a1424;border:1px solid #24486f}.danger{background:#36141a;border:1px solid #7d2836}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.actions>*{flex:1}
h3{margin:24px 2px 10px}.job{padding:14px;border:1px solid #173453;border-radius:16px;background:#08111e;margin:9px 0}.jobtop{display:flex;justify-content:space-between;gap:10px}.pill{font-size:11px;border:1px solid #2b527b;padding:5px 8px;border-radius:99px;color:#b9dcff}
input,textarea,select{width:100%;background:#050b14;color:#fff;border:1px solid #234364;border-radius:12px;padding:12px;font:inherit;outline:none} input:focus,textarea:focus,select:focus{border-color:var(--blue)}
textarea{min-height:88px;resize:vertical}label{display:block;margin:12px 0 6px;color:#b8c7da;font-size:13px;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
dialog{width:min(720px,96vw);max-height:92vh;overflow:auto;border:1px solid #21486e;border-radius:22px;background:#07101c;color:#fff;padding:18px}dialog::backdrop{background:#000b}
canvas{width:100%;height:150px;background:#fff;border-radius:12px;touch-action:none}.small{padding:9px 11px;font-size:13px}.empty{text-align:center;padding:28px;color:var(--muted)}
@media(max-width:520px){.row{grid-template-columns:1fr}.hero h2{font-size:25px}}
@media print{body{background:white;color:black}header,.no-print,#dashboard{display:none!important}#printArea{display:block!important}.printsheet{font-family:Arial;padding:20px}.printsheet h1{color:#087dd1}}
#printArea{display:none}
</style>
</head>
<body>
<header><div class="logo">AX</div><div><h1>AXIS Jobs</h1><div class="sub">AutoTech Job Management</div></div></header>
<main id="dashboard">
<section class="hero"><div class="muted">AXIS AUTOTECH</div><h2>Jobs. <b>Sorted.</b></h2><div class="muted">Create, manage and sign off vehicle jobs from your phone.</div></section>
<div class="grid">
 <div class="card"><div class="muted">Open jobs</div><div class="stat" id="openCount">0</div></div>
 <div class="card"><div class="muted">Completed</div><div class="stat" id="doneCount">0</div></div>
</div>
<div class="actions"><button onclick="newJob()">＋ New Job</button><button class="secondary" onclick="exportJobs()">Backup Jobs</button></div>
<input id="search" placeholder="Search reg, customer or job number…" oninput="render()">
<h3>Jobs</h3><div id="jobs"></div>
</main>

<dialog id="jobDialog">
<form id="jobForm" onsubmit="saveJob(event)">
<input type="hidden" id="id">
<div style="display:flex;justify-content:space-between;align-items:center"><h2 id="formTitle">New Job</h2><button type="button" class="secondary small" onclick="jobDialog.close()">✕</button></div>
<div class="row"><div><label>Job number</label><input id="jobNo" required></div><div><label>Date</label><input id="date" type="date" required></div></div>
<label>Customer / company</label><input id="customer" required>
<div class="row"><div><label>Phone</label><input id="phone" type="tel"></div><div><label>Email</label><input id="email" type="email"></div></div>
<div class="row"><div><label>Vehicle registration</label><input id="reg" required autocapitalize="characters"></div><div><label>Mileage</label><input id="mileage" inputmode="numeric"></div></div>
<div class="row"><div><label>Make</label><input id="make"></div><div><label>Model</label><input id="model"></div></div>
<label>Work required</label><textarea id="work"></textarea>
<label>Parts / materials used</label><textarea id="parts"></textarea>
<label>Engineer notes</label><textarea id="notes"></textarea>
<label>Status</label><select id="status"><option>Booked</option><option>In Progress</option><option>Completed</option></select>
<label>Job photos</label><input id="photos" type="file" accept="image/*" multiple capture="environment"><div class="muted">Photo names are recorded in this first version. Full cloud photo storage comes later.</div>
<label>Customer signature</label><canvas id="sig" width="700" height="220"></canvas>
<div class="actions"><button type="button" class="secondary small" onclick="clearSig()">Clear signature</button></div>
<div class="actions"><button type="submit">Save Job</button><button type="button" class="secondary" onclick="printCurrent()">Job Sheet</button></div>
</form>
</dialog>
<div id="printArea"></div>

<script>
const $=id=>document.getElementById(id), jobDialog=$('jobDialog'), sig=$('sig'), ctx=sig.getContext('2d');
let jobs=JSON.parse(localStorage.getItem('axisJobs')||'[]'), drawing=false;
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){
 let q=$('search').value.toLowerCase();
 $('openCount').textContent=jobs.filter(j=>j.status!=='Completed').length;
 $('doneCount').textContent=jobs.filter(j=>j.status==='Completed').length;
 let f=jobs.filter(j=>[j.jobNo,j.customer,j.reg].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.updated-a.updated);
 $('jobs').innerHTML=f.length?f.map(j=>`<div class="job" onclick="editJob('${j.id}')"><div class="jobtop"><b>${esc(j.reg)} · ${esc(j.customer)}</b><span class="pill">${esc(j.status)}</span></div><div class="muted">${esc(j.jobNo)} · ${esc(j.date)} · ${esc(j.make)} ${esc(j.model)}</div></div>`).join(''):'<div class="empty">No jobs yet. Hit <b>New Job</b> 👊</div>';
}
function newJob(){
 $('jobForm').reset(); $('id').value=''; $('date').value=new Date().toISOString().slice(0,10); $('jobNo').value='AX-'+String(Date.now()).slice(-6); $('formTitle').textContent='New Job'; clearSig(); jobDialog.showModal();
}
function editJob(id){
 let j=jobs.find(x=>x.id===id); if(!j)return;
 ['id','jobNo','date','customer','phone','email','reg','mileage','make','model','work','parts','notes','status'].forEach(k=>$(k).value=j[k]||'');
 $('formTitle').textContent='Edit '+j.jobNo; clearSig();
 if(j.signature){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,sig.width,sig.height);im.src=j.signature}
 jobDialog.showModal();
}
function saveJob(e){
 e.preventDefault(); let id=$('id').value||crypto.randomUUID();
 let j={id,updated:Date.now(),photos:[...$('photos').files].map(f=>f.name),signature:sig.toDataURL()};
 ['jobNo','date','customer','phone','email','reg','mileage','make','model','work','parts','notes','status'].forEach(k=>j[k]=$(k).value.trim?.()??$(k).value);
 let n=jobs.findIndex(x=>x.id===id); n>=0?jobs[n]=j:jobs.push(j); localStorage.setItem('axisJobs',JSON.stringify(jobs)); jobDialog.close(); render();
}
function clearSig(){ctx.fillStyle='#fff';ctx.fillRect(0,0,sig.width,sig.height);ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.lineCap='round'}
function pos(e){let r=sig.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return [(p.clientX-r.left)*sig.width/r.width,(p.clientY-r.top)*sig.height/r.height]}
function start(e){drawing=true;let [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);e.preventDefault()}
function move(e){if(!drawing)return;let[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();e.preventDefault()}
['mousedown','touchstart'].forEach(x=>sig.addEventListener(x,start,{passive:false}));
['mousemove','touchmove'].forEach(x=>sig.addEventListener(x,move,{passive:false}));
['mouseup','mouseleave','touchend'].forEach(x=>sig.addEventListener(x,()=>drawing=false));
function printCurrent(){
 let id=$('id').value, j=id?jobs.find(x=>x.id===id):null;
 if(!j){alert('Save the job first, then open it and tap Job Sheet.');return}
 $('printArea').innerHTML=`<div class="printsheet"><h1>AXIS AutoTech</h1><h2>Job Sheet ${esc(j.jobNo)}</h2><p><b>Date:</b> ${esc(j.date)}</p><p><b>Customer:</b> ${esc(j.customer)} &nbsp; <b>Phone:</b> ${esc(j.phone)}</p><p><b>Vehicle:</b> ${esc(j.reg)} — ${esc(j.make)} ${esc(j.model)} &nbsp; <b>Mileage:</b> ${esc(j.mileage)}</p><hr><h3>Work required</h3><p>${esc(j.work).replace(/\n/g,'<br>')}</p><h3>Parts / materials</h3><p>${esc(j.parts).replace(/\n/g,'<br>')}</p><h3>Engineer notes</h3><p>${esc(j.notes).replace(/\n/g,'<br>')}</p><p><b>Status:</b> ${esc(j.status)}</p><h3>Customer signature</h3><img src="${j.signature}" style="max-width:360px;border:1px solid #aaa"></div>`;
 window.print();
}
function exportJobs(){let b=new Blob([JSON.stringify(jobs,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='axis-jobs-backup.json';a.click()}
clearSig();render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body></html>
